<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRC WorkTime Pro</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,'Noto Sans Thai',sans-serif;
  background:#f4f7fb;
  color:#1f2937
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.top{
  background:linear-gradient(135deg,#2563eb,#38bdf8);
  color:#fff;
  padding:18px 20px
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:16px
}

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#dbeafe,#f0f9ff);
  padding:20px
}

.loginbox,
.card,
.stat,
.item{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  box-shadow:0 4px 18px #0000000b
}

.loginbox{
  width:min(430px,100%);
  padding:28px
}

.logo{
  width:62px;
  height:62px;
  border-radius:17px;
  background:#2563eb;
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:20px;
  margin-bottom:12px
}

h1,h2,h3{
  margin-top:0
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:12px 0 6px
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #d5dce5;
  border-radius:11px;
  background:#fff
}

textarea{
  min-height:90px
}

.btn{
  padding:10px 14px;
  border:0;
  border-radius:11px;
  font-weight:700
}

.primary{
  background:#2563eb;
  color:#fff
}

.success{
  background:#16a34a;
  color:#fff
}

.warning{
  background:#f59e0b;
  color:#fff
}

.danger{
  background:#dc2626;
  color:#fff
}

.gray{
  background:#e5e7eb;
  color:#374151
}

.full{
  width:100%;
  margin-top:16px
}

.demo{
  margin-top:14px;
  padding:12px;
  background:#f8fafc;
  border-radius:12px;
  font-size:13px
}

.hidden{
  display:none!important
}

.userbar{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:11px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.nav{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:9px 16px;
  display:flex;
  gap:7px;
  overflow:auto;
  position:sticky;
  top:0;
  z-index:5
}

.nav button{
  border:0;
  border-radius:99px;
  padding:9px 13px;
  background:#f1f5f9;
  color:#475569;
  font-weight:700;
  white-space:nowrap
}

.nav button.active{
  background:#2563eb;
  color:#fff
}

.grid{
  display:grid;
  gap:14px
}

.g2{
  grid-template-columns:repeat(2,minmax(0,1fr))
}

.g3{
  grid-template-columns:repeat(3,minmax(0,1fr))
}

.g4{
  grid-template-columns:repeat(4,minmax(0,1fr))
}

.card,
.stat,
.item{
  padding:17px
}

.stat .label{
  font-size:13px;
  color:#64748b
}

.stat .num{
  font-size:25px;
  font-weight:800;
  margin-top:7px
}

.section{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:4px 0 14px
}

.muted{
  font-size:13px;
  color:#64748b
}

.list{
  display:grid;
  gap:10px
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:99px;
  font-size:12px;
  font-weight:700;
  background:#e5e7eb
}

.blue{
  background:#dbeafe;
  color:#1d4ed8
}

.green{
  background:#dcfce7;
  color:#15803d
}

.orange{
  background:#fef3c7;
  color:#b45309
}

.red{
  background:#fee2e2;
  color:#b91c1c
}

.itemtop{
  display:flex;
  justify-content:space-between;
  gap:10px
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:10px
}

.money{
  font-size:20px;
  font-weight:800;
  color:#15803d
}

.empty{
  text-align:center;
  padding:25px;
  color:#94a3b8
}

.tablewrap{
  overflow:auto
}

.table{
  width:100%;
  border-collapse:collapse;
  min-width:650px
}

.table th,
.table td{
  padding:10px;
  border-bottom:1px solid #edf0f3;
  text-align:left;
  font-size:13px
}

.table th{
  background:#f8fafc
}

.toast{
  position:fixed;
  right:15px;
  bottom:15px;
  background:#111827;
  color:#fff;
  padding:12px 16px;
  border-radius:11px;
  display:none;
  z-index:20
}

.toast.show{
  display:block
}

footer{
  text-align:center;
  color:#94a3b8;
  padding:25px;
  font-size:12px
}

@media(max-width:700px){
  .g2,
  .g3,
  .g4{
    grid-template-columns:1fr 1fr
  }
}

@media(max-width:500px){
  .g2,
  .g3,
  .g4{
    grid-template-columns:1fr
  }

  .itemtop{
    display:block
  }

  .actions .btn{
    flex:1
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">

  <div class="loginbox">

    <div class="logo">PRC</div>

    <h1>PRC WorkTime Pro</h1>

    <p class="muted">
      ระบบพนักงาน • ช่าง • แอดมิน
    </p>

    <form id="loginForm">

      <label>ชื่อผู้ใช้</label>

      <input
        id="u"
        required
        placeholder="เช่น E001"
      >

      <label>รหัสผ่าน</label>

      <input
        id="pw"
        type="password"
        required
      >

      <button class="btn primary full">
        เข้าสู่ระบบ
      </button>

    </form>

    <div class="demo">

      <b>บัญชีทดลอง</b>

      <br>

      แอดมิน:
      <b>admin / 1234</b>

      <br>

      พนักงาน:
      <b>E001 / 1111</b>

      <br>

      ช่าง:
      <b>T001 / 2222</b>

    </div>

  </div>

</div>


<!-- APP -->
<div id="app" class="hidden">

  <div class="top">

    <b style="font-size:22px">
      PRC WorkTime Pro
    </b>

    <div id="role"></div>

  </div>


  <div class="userbar">

    <div>

      <small>ผู้ใช้</small>

      <br>

      <b id="who"></b>

    </div>

    <button
      class="btn danger"
      onclick="logout()"
    >
      ออกจากระบบ
    </button>

  </div>


  <div id="nav" class="nav"></div>


  <main
    id="main"
    class="wrap"
  ></main>


  <footer>
    ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้ด้วย LocalStorage
  </footer>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================
   DATA
========================= */

const employees = [

  {
    id:'E001',
    name:'สมชาย ใจดี',
    dept:'ฝ่ายผลิต',
    line:'Line A',
    base:15000
  },

  {
    id:'E002',
    name:'สมหญิง รักงาน',
    dept:'ฝ่ายผลิต',
    line:'Line B',
    base:16000
  },

  {
    id:'E003',
    name:'วิชัย ขยันดี',
    dept:'คลังสินค้า',
    line:'Line C',
    base:15500
  },

  {
    id:'E004',
    name:'นภัสสร ตั้งใจ',
    dept:'ฝ่ายผลิต',
    line:'Line A',
    base:17000
  }

];


const techs = [

  {
    id:'T001',
    name:'ช่างเอก',
    line:'Line A',
    rate:150
  },

  {
    id:'T002',
    name:'ช่างบอย',
    line:'Line B',
    rate:180
  }

];


const machines = [

  {
    id:'M001',
    name:'เครื่องบรรจุ A1',
    line:'Line A',
    status:'ปกติ'
  },

  {
    id:'M002',
    name:'เครื่องซีล A2',
    line:'Line A',
    status:'ปกติ'
  },

  {
    id:'M003',
    name:'เครื่องแพ็ก B1',
    line:'Line B',
    status:'ปกติ'
  },

  {
    id:'M004',
    name:'เครื่องลำเลียง C1',
    line:'Line C',
    status:'ปกติ'
  },

  {
    id:'M005',
    name:'เครื่องชั่ง C2',
    line:'Line C',
    status:'ปกติ'
  }

];


/* =========================
   STORAGE
========================= */

let repairs =
  JSON.parse(
    localStorage.prcRepairs || '[]'
  );

let ots =
  JSON.parse(
    localStorage.prcOT || '[]'
  );

let holidays =
  JSON.parse(
    localStorage.prcHoliday || '[]'
  );


let me = null;

let page = 'home';


/* =========================
   HELPERS
========================= */

const emp =
  id =>
    employees.find(
      x => x.id === id
    );


const tech =
  id =>
    techs.find(
      x => x.id === id
    );


const mach =
  id =>
    machines.find(
      x => x.id === id
    );


const today =
  () =>
    new Date()
      .toISOString()
      .slice(0,10);


const money =
  n =>
    Number(n || 0)
      .toLocaleString('th-TH')
      + ' บาท';


const dt =
  d =>
    d
      ? new Date(
          d + 'T00:00:00'
        ).toLocaleDateString(
          'th-TH',
          {
            year:'numeric',
            month:'short',
            day:'numeric'
          }
        )
      : '-';


function save(){

  localStorage.prcRepairs =
    JSON.stringify(repairs);

  localStorage.prcOT =
    JSON.stringify(ots);

  localStorage.prcHoliday =
    JSON.stringify(holidays);

}


function msg(x){

  let t =
    document.getElementById('toast');

  t.textContent = x;

  t.classList.add('show');

  setTimeout(
    () =>
      t.classList.remove('show'),
    2000
  );

}


function esc(x){

  return String(x ?? '')
    .replace(
      /[&<>"']/g,
      c =>
        ({
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          '"':'&quot;',
          "'":'&#39;'
        }[c])
    );

}


function badge(s){

  let c =
    s === 'ซ่อมเสร็จ' ||
    s === 'ปกติ'
      ? 'green'
      : s === 'กำลังซ่อม'
        ? 'orange'
        : s === 'แจ้งซ่อม'
          ? 'red'
          : 'blue';

  return `
    <span class="badge ${c}">
      ${s}
    </span>
  `;

}


/* =========================
   INCOME
========================= */

function income(id){

  let e =
    emp(id);

  let o =
    ots
      .filter(
        x => x.userId === id
      )
      .reduce(
        (s,x) =>
          s + x.amount,
        0
      );

  let h =
    holidays
      .filter(
        x => x.userId === id
      )
      .reduce(
        (s,x) =>
          s + x.amount,
        0
      );

  return {

    base:e?.base || 0,

    ot:o,

    hol:h,

    total:
      (e?.base || 0)
      + o
      + h

  };

}


/* =========================
   NAVIGATION + APP
========================= */

function nav(){
  const el=document.getElementById('nav');
  if(!me){el.innerHTML='';return;}
  let a=[];
  if(me.role==='admin'){
    a=[['home','Dashboard'],['employees','พนักงาน'],['repairs','งานซ่อม'],['machines','เครื่องจักร'],['ot','OT'],['holiday','วันหยุด'],['income','รายได้']];
  }else if(me.role==='employee'){
    a=[['home','หน้าหลัก'],['repair','แจ้งซ่อม'],['ot','OT'],['income','รายได้'],['holiday','วันหยุด']];
  }else{
    a=[['home','หน้าหลัก'],['jobs','งานซ่อมวันนี้'],['machines','เครื่องจักร'],['ot','OT']];
  }
  el.innerHTML=a.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
}

function go(p){page=p;nav();render();window.scrollTo({top:0,behavior:'smooth'});}

function render(){
  const main=document.getElementById('main');
  if(!me){main.innerHTML='';return;}
  const pages={
    home:homePage,
    employees:employeesPage,
    repairs:repairsPage,
    repair:repairPage,
    machines:machinesPage,
    jobs:jobsPage,
    ot:otPage,
    holiday:holidayPage,
    income:incomePage
  };
  main.innerHTML=(pages[page]||homePage)();
}

function homePage(){
  const active=repairs.filter(x=>x.status!=='ซ่อมเสร็จ').length;
  const normal=machines.filter(x=>x.status==='ปกติ').length;
  const total=me.role==='admin'?employees.length:1;
  return `<div class="section"><div><h2>${me.role==='admin'?'Dashboard':'สวัสดี '+esc(me.name)}</h2><div class="muted">PRC WorkTime Pro</div></div></div>
  <div class="grid g4">
    <div class="stat"><div class="label">พนักงาน</div><div class="num">${total}</div></div>
    <div class="stat"><div class="label">งานซ่อมค้าง</div><div class="num">${active}</div></div>
    <div class="stat"><div class="label">เครื่องจักรปกติ</div><div class="num">${normal}/${machines.length}</div></div>
    <div class="stat"><div class="label">OT ของฉัน</div><div class="num">${money(ots.filter(x=>x.userId===me.id).reduce((s,x)=>s+Number(x.amount||0),0))}</div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>เมนูใช้งาน</h3><div class="actions">${me.role==='admin'?'<button class="btn primary" onclick="go(\'employees\')">จัดการพนักงาน</button>':''}<button class="btn warning" onclick="go('${me.role==='employee'?'repair':'jobs'}')">งานซ่อม</button><button class="btn success" onclick="go('ot')">บันทึก OT</button></div></div>`;
}

function employeesPage(){
  return `<div class="section"><h2>พนักงาน</h2></div><div class="card tablewrap"><table class="table"><thead><tr><th>รหัส</th><th>ชื่อ</th><th>แผนก</th><th>Line</th><th>เงินเดือน</th></tr></thead><tbody>${employees.map(e=>`<tr><td>${e.id}</td><td>${esc(e.name)}</td><td>${esc(e.dept)}</td><td>${esc(e.line)}</td><td>${money(e.base)}</td></tr>`).join('')}</tbody></table></div>`;
}

function repairsPage(){
  return `<div class="section"><h2>งานซ่อม</h2><button class="btn primary" onclick="go('repair')">+ แจ้งซ่อม</button></div>${repairs.length?`<div class="list">${repairs.map((r,i)=>repairCard(r,i,true)).join('')}</div>`:'<div class="card empty">ยังไม่มีรายการแจ้งซ่อม</div>'}`;
}

function repairPage(){
  const mine=repairs.filter(x=>x.userId===me.id);
  return `<div class="section"><h2>แจ้งซ่อม</h2></div><div class="card"><label>เครื่องจักร</label><select id="repairMachine">${machines.map(m=>`<option value="${m.id}">${esc(m.id)} - ${esc(m.name)}</option>`).join('')}</select><label>รายละเอียดปัญหา</label><textarea id="repairDetail" placeholder="อธิบายอาการเสีย"></textarea><button class="btn primary full" onclick="addRepair()">ส่งแจ้งซ่อม</button></div><div style="margin-top:14px"><h3>รายการของฉัน</h3>${mine.length?`<div class="list">${mine.map((r,i)=>repairCard(r,repairs.indexOf(r),false)).join('')}</div>`:'<div class="card empty">ยังไม่มีรายการ</div>'}</div>`;
}

function repairCard(r,i,admin){
  const m=mach(r.machineId);
  return `<div class="item"><div class="itemtop"><div><b>${esc(m?.name||r.machineId)}</b><div class="muted">${esc(r.detail||'-')} • ${dt(r.date)}</div></div>${badge(r.status)}</div><div class="actions">${admin&&r.status!=='ซ่อมเสร็จ'?`<button class="btn success" onclick="finishRepair(${i})">ทำเครื่องหมายซ่อมเสร็จ</button>`:''}${admin?`<button class="btn danger" onclick="deleteRepair(${i})">ลบ</button>`:''}</div></div>`;
}

function addRepair(){
  const machineId=document.getElementById('repairMachine').value;
  const detail=document.getElementById('repairDetail').value.trim();
  if(!detail){msg('กรุณาระบุรายละเอียดปัญหา');return;}
  repairs.unshift({id:'R'+Date.now(),userId:me.id,machineId,detail,status:'แจ้งซ่อม',date:today()});save();msg('แจ้งซ่อมเรียบร้อย');render();
}
function finishRepair(i){repairs[i].status='ซ่อมเสร็จ';save();msg('อัปเดตสถานะแล้ว');render();}
function deleteRepair(i){if(confirm('ต้องการลบรายการนี้หรือไม่?')){repairs.splice(i,1);save();render();}}

function jobsPage(){
  const list=repairs.filter(x=>x.status!=='ซ่อมเสร็จ');
  return `<div class="section"><h2>งานซ่อมวันนี้</h2></div>${list.length?`<div class="list">${list.map((r)=>repairCard(r,repairs.indexOf(r),true)).join('')}</div>`:'<div class="card empty">ไม่มีงานซ่อมค้าง</div>'}`;
}

function machinesPage(){
  return `<div class="section"><h2>เครื่องจักร</h2></div><div class="grid g2">${machines.map(m=>`<div class="item"><div class="itemtop"><div><b>${esc(m.id)} - ${esc(m.name)}</b><div class="muted">${esc(m.line)}</div></div>${badge(m.status)}</div></div>`).join('')}</div>`;
}

function otPage(){
  const mine=ots.filter(x=>x.userId===me.id);
  return `<div class="section"><h2>OT</h2></div><div class="card"><label>วันที่</label><input id="otDate" type="date" value="${today()}"><label>จำนวนชั่วโมง</label><input id="otHours" type="number" min="0" step="0.5" placeholder="เช่น 2"><label>จำนวนเงิน</label><input id="otAmount" type="number" min="0" placeholder="เช่น 300"><button class="btn success full" onclick="addOT()">บันทึก OT</button></div><div style="margin-top:14px"><h3>รายการ OT ของฉัน</h3>${mine.length?`<div class="list">${mine.map(x=>`<div class="item"><div class="itemtop"><div><b>${dt(x.date)}</b><div class="muted">${x.hours||0} ชั่วโมง</div></div><span class="money">${money(x.amount)}</span></div></div>`).join('')}</div>`:'<div class="card empty">ยังไม่มีรายการ OT</div>'}</div>`;
}
function addOT(){
  const date=document.getElementById('otDate').value||today();
  const hours=Number(document.getElementById('otHours').value||0);
  const amount=Number(document.getElementById('otAmount').value||0);
  if(amount<=0){msg('กรุณาระบุจำนวนเงิน OT');return;}
  ots.unshift({id:'OT'+Date.now(),userId:me.id,date,hours,amount});save();msg('บันทึก OT แล้ว');render();
}

function holidayPage(){
  const mine=holidays.filter(x=>x.userId===me.id);
  return `<div class="section"><h2>วันหยุด</h2></div><div class="card"><label>วันที่</label><input id="holDate" type="date" value="${today()}"><label>ประเภท</label><select id="holType"><option>วันหยุด</option><option>วันหยุดนักขัตฤกษ์</option><option>ทำงานวันหยุด</option></select><label>จำนวนเงิน</label><input id="holAmount" type="number" min="0" value="0"><button class="btn primary full" onclick="addHoliday()">บันทึก</button></div><div style="margin-top:14px"><h3>รายการของฉัน</h3>${mine.length?`<div class="list">${mine.map(x=>`<div class="item"><div class="itemtop"><div><b>${dt(x.date)}</b><div class="muted">${esc(x.type)}</div></div><span class="money">${money(x.amount)}</span></div></div>`).join('')}</div>`:'<div class="card empty">ยังไม่มีรายการ</div>'}</div>`;
}
function addHoliday(){
  holidays.unshift({id:'H'+Date.now(),userId:me.id,date:document.getElementById('holDate').value||today(),type:document.getElementById('holType').value,amount:Number(document.getElementById('holAmount').value||0)});save();msg('บันทึกวันหยุดแล้ว');render();
}

function incomePage(){
  const ids=me.role==='admin'?employees.map(e=>e.id):[me.id];
  return `<div class="section"><h2>รายได้</h2></div><div class="grid g2">${ids.map(id=>{const e=emp(id),x=income(id);return `<div class="card"><h3>${esc(e?.name||id)}</h3><div class="muted">เงินเดือน ${money(x.base)}</div><p>OT: <b>${money(x.ot)}</b></p><p>วันหยุด: <b>${money(x.hol)}</b></p><div class="money">รวม ${money(x.total)}</div></div>`}).join('')}</div>`;
}

function logout(){
  me=null;page='home';
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('loginForm').reset();
}

/* =========================
   LOGIN
========================= */

document.getElementById('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  const username=document.getElementById('u').value.trim();
  const password=document.getElementById('pw').value;
  let user=null;

  if(username==='admin' && password==='1234'){
    user={id:'admin',name:'ผู้ดูแลระบบ',role:'admin'};
  }else if(username==='E001' && password==='1111'){
    const e1=emp('E001'); user={id:'E001',name:e1?.name||'สมชาย ใจดี',role:'employee'};
  }else if(username==='T001' && password==='2222'){
    const t1=tech('T001'); user={id:'T001',name:t1?.name||'ช่างเอก',role:'tech'};
  }

  if(!user){
    msg('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    document.getElementById('pw').focus();
    return;
  }

  me=user;page='home';
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('who').textContent=user.name;
  document.getElementById('role').textContent=user.role==='admin'?'ผู้ดูแลระบบ':user.role==='employee'?'พนักงาน':'ช่าง';
  nav();render();
});

/* เริ่มต้นระบบ */
nav();
</script>
